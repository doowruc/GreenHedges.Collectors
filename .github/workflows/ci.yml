# Build and test on every pull request and on main. Warnings are errors (Directory.Build.props),
# and a NuGet vulnerability advisory fails restore, so this also flags vulnerable packages.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install age (used by the off-site backup tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Lint CloudFormation templates
        run: pipx run --spec cfn-lint==1.45.0 cfn-lint deploy/aws/*.yaml

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
